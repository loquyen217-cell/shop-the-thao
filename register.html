<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng Ký Tài Khoản - SportShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-bar">
      <a href="index.html" class="logo-container">
        <img src="images/logo.png" alt="Logo SportShop" class="logo-img" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
        <span class="logo-text">SPORT SHOP</span>
      </a>
      <div><a href="cart.html" style="color:white; text-decoration:none; font-weight:bold;">🛒 Giỏ hàng (0)</a></div>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Trang Chủ</a></li>
        <li><a href="products.html">Sản Phẩm</a></li>
        <li><a href="about.html">Giới Thiệu & Tin Tức</a></li>
        <li><a href="contact.html">Liên Hệ</a></li>
        <li><a href="register.html" class="active">Đăng Ký</a></li>
        <li><a href="cart.html">Giỏ Hàng</a></li>
      </ul>
    </nav>
  </header>

  <!-- NỘI DUNG CHÍNH CHỨA BẢNG ĐĂNG KÝ VÀ POSTER -->
  <div class="container">
    
    <!-- Bảng bố cục tổng thể (Chia Form và Poster) -->
    <table class="layout-table">
      <tr>
        <!-- CỘT BÊN TRÁI: FORM ĐĂNG KÝ DẠNG BẢNG -->
        <td class="form-column">
          <h2 class="form-title">ĐĂNG KÝ TÀI KHOẢN THÀNH VIÊN</h2>
          <p class="form-subtitle">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản.</p>

          <form id="registerForm" novalidate>
            <!-- Bảng chứa các ô nhập liệu -->
            <table class="form-table">
              <tr>
                <td class="label-cell"><label for="fullname">Họ và tên <span class="required">*</span></label></td>
                <td class="input-cell">
                  <input type="text" id="fullname" placeholder="Nhập ít nhất 5 ký tự">
                  <span class="error-msg" id="errFullname"></span>
                </td>
              </tr>

              <tr>
                <td class="label-cell"><label for="email">Email <span class="required">*</span></label></td>
                <td class="input-cell">
                  <input type="email" id="email" placeholder="nguyenvana@gmail.com">
                  <span class="error-msg" id="errEmail"></span>
                </td>
              </tr>

              <tr>
                <td class="label-cell"><label for="phone">Số điện thoại <span class="required">*</span></label></td>
                <td class="input-cell">
                  <input type="text" id="phone" maxlength="10" placeholder="0912345678 (đúng 10 số)">
                  <span class="error-msg" id="errPhone"></span>
                </td>
              </tr>

              <tr>
                <td class="label-cell"><label for="cccd">Số CCCD <span class="required">*</span></label></td>
                <td class="input-cell">
                  <input type="text" id="cccd" maxlength="12" placeholder="001203001234 (đúng 12 số)">
                  <span class="error-msg" id="errCCCD"></span>
                </td>
              </tr>

              <tr>
                <td class="label-cell"></td>
                <td class="input-cell">
                  <button type="submit" class="btn btn-primary">Tạo Tài Khoản</button>
                  <button type="reset" class="btn btn-reset">Làm mới</button>
                </td>
              </tr>
            </table>
          </form>
        </td>

        <!-- CỘT BÊN PHẢI: POSTER QUẢNG CÁO -->
        <td class="poster-column">
          <div class="poster-box">
            <h3>ƯU ĐÃI THÀNH VIÊN</h3>
            <img src="images/voucher.png" alt="Poster Khuyến Mãi" class="poster-img" onerror="this.src='https://via.placeholder.com/260x380?text=POSTER+KHUYEN+MAI'">
            <p class="poster-desc"><strong></strong> </p>
          </div>
        </td>
      </tr>
    </table>

  </div>

  <footer>
    <p>&copy; 2026 SportShop. Tất cả quyền được bảo lưu.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
